name: Tests

# The unit tests need no sound device: the mixer and the music player render into buffers.
# IsAotCompatible keeps the AOT analyzers on for the library.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.4xx
      - name: Build
        run: dotnet build Encore.Audio.slnx -c Release
      - name: Unit tests
        run: dotnet test --solution Encore.Audio.slnx -c Release --no-build
